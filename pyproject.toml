[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenced"
version = "0.1.0"
description = "A small Python service whose architecture is enforced by tests"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Guilherme Bortoletto" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "plants: the test plants a tree a check has to refuse",
    "admits: the test plants a tree a check has to accept",
]
