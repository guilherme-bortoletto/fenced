name: ci

# Main, a night branch, and pull requests. A pull request opened with a token that belongs to
# a person starts a workflow run of its own, and pull-request.yml publishes with one, so a
# night branch queues a push run and a pull request run once its pull request exists. Both
# triggers stay. The first push of a run has no pull request yet and the checks on it are
# worth having. And where the secret holding the person's token is absent, which is what the
# fallback in pull-request.yml covers and nothing further, the publish is made with the token
# a workflow runs with, which starts no run of its own, and the push trigger is then the only
# one a night branch has.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: fences
        run: python -m pytest -q
      - name: text rules
        run: python scripts/gates.py --text
